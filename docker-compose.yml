services:
  frontend:
    build:
      context: .
    # Unique name so this stack can run next to (or replace) the old "react-app" container
    container_name: thepk-site
    ports:
      # Published on host port 3012 (the old react-app stack keeps 3001); override with HOST_PORT
      - "${HOST_PORT:-3012}:3001"
    restart: unless-stopped
    pull_policy: build
