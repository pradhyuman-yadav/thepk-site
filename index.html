<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="author" content="Pradhyuman Yadav" />
    <!-- server/index.js replaces everything between these markers with per-page tags -->
    <!--seo-head-->
    <title>Pradhyuman Yadav: AI/Software Engineer</title>
    <meta name="description" content="Daily AI news briefs, developer tools, and notes on self-hosted AI infrastructure by Pradhyuman Yadav, AI/Software Engineer." />
    <!--/seo-head-->
    <script>
      // Apply the saved or system theme before first paint. Mirrors src/contexts/ThemeContext.jsx.
      (function () {
        var dark;
        try {
          var saved = localStorage.getItem('darkMode');
          dark = saved !== null ? JSON.parse(saved) : window.matchMedia('(prefers-color-scheme: dark)').matches;
        } catch (e) {
          dark = false;
        }
        document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
        document.documentElement.setAttribute('data-dark', dark ? '1' : '0');
        // Page skins (same list as SKINS in src/utils/skins.js)
        if (location.pathname === '/flightline') document.documentElement.setAttribute('data-skin', 'flightline');
      })();
    </script>
  </head>
  <body>
    <div id="root"><!--seo-body--></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
